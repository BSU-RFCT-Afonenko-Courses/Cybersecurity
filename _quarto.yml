fail-if-warnings: true
project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!**/*.scss'
  - ./assets/**
  - '!theory/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!README.md'
  - '!CI/**'
  - '!docs/**'
  - '!ci-logs/**'
  - '!.agents/**'
  - '!.aws/**'
  - '!.codex/**'
  - '!**/.render-cache/**'
  - '!**/.runtime-cache/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!UPSTREAM.md'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  - '!task/**'
  - '!seminars/**'
  - '!control-works/**'
  - '!shared/**'
  - '!extensions/**'
  pre-render:
  - python3 CI/prepare-course-visualizations.py
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: [cosmo, _extensions/Afonenko-Course-Tools/course-theme/theme.scss]
    html-math-method: mathml
    embed-resources: false
    toc: false
lang: ru
author:
- Афоненко Анатолий
- Войтович Елизавета
course:
  id: cybersecurity
website:
  navbar:
    title: false
  title: Основы кибербезопасности
  site-url: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/
  search: true
  page-footer: Афоненко Анатолий
filters:
- course-core
- course-presentation
- reference-catalog
- course-navigation
reference-catalog:
  namespace: portal
  publication:
    title: Основы кибербезопасности
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- path: theory
  to: default
- path: task
  to: default
- path: seminars
  to: default
course-navigation:
  enabled: true
