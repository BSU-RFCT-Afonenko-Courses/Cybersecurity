fail-if-warnings: true
project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!**/*.scss'
  - ./assets/**
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!README.md'
  - '!CI/**'
  - '!docs/**'
  - '!ci-logs/**'
  - '!.agents/**'
  - '!.aws/**'
  - '!.codex/**'
  - '!**/.render-cache/**'
  - '!**/.runtime-cache/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!UPSTREAM.md'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  - '!task/**'
  - '!seminars/**'
  - '!control-works/**'
  - '!Новые семинары'
  - '!filters/**'
  - '!experiments/**'
  - '!shared/**'
  - '!extensions/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    html-math-method: mathml
    embed-resources: false
    theme:
    - cosmo
    - styles/offline-fonts.scss
    toc: false
lang: ru
author:
- Афоненко Анатолий
- Войтович Елизавета
course:
  id: cybersecurity
website:
  title: Основы кибербезопасности
  site-url: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/
  search: true
  page-footer: Афоненко Анатолий
  favicon: assets/cover.png
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Основы кибербезопасности
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- theory
- task
- seminars
metadata-files:
- _navigation.yml
