profile:
  default: student
  group:
  - - student
    - full
course-site:
  projects:
  - id: theory
    path: theory
    format: html
    mount: theory
  - id: tasks
    path: tasks
    format: html
    mount: tasks
  - id: lectures
    path: lectures
    format: revealjs
    mount: lectures
  - id: practice
    path: practice
    format: revealjs
    mount: practice
  - id: handbook
    path: handbook
    format: html
    mount: handbook
