project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - ./assets/**
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!README.md'
  - '!tools/**'
  - '!.agents/**'
  - '!.aws/**'
  - '!.codex/**'
  - '!**/.render-cache/**'
  - '!**/.runtime-cache/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!UPSTREAM.md'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  - '!task/**'
  - '!seminars/**'
  - '!Новые семинары'
  - '!tests/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: false
lang: ru
course:
  id: cybersecurity
website:
  title: Основы кибербезопасности
  search: true
  page-footer: Афоненко Анатолий
  favicon: assets/cover.png
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Основы кибербезопасности
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- theory
- task
- seminars
