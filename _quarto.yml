project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - ./assets/**
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!README.md'
  - '!.agents/**'
  - '!.aws/**'
  - '!.codex/**'
  - '!**/.render-cache/**'
  - '!**/.runtime-cache/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!UPSTREAM.md'
  - '!providers.json'
  - '!installed-packages.json'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: false
lang: ru
course:
  id: cybersecurity-portal
website:
  title: Основы кибербезопасности
  search: true
  page-footer: Афоненко Анатолий
  favicon: assets/cover.png
filters:
- course-core
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Основы кибербезопасности
  exports:
    portal:
    - sec-portal
    - sec-course-plan
    theory:
    - sec-theory
    - sec-theory-crypto-random
    - sec-theory-crypto-hash
    - sec-theory-crypto-key-gen
    - sec-theory-crypto-cypher
    tasks:
    - sec-tasks
    - sec-plan
    - sec-lab-crypto-rng
    - exr-lab-crypto-rng
    - sec-lab-crypto-hash
    - exr-lab-crypto-hash
    - sec-lab-crypto-key-gen
    - exr-lab-crypto-key-gen
    - sec-lab-crypto-cypher-symmetric
    - exr-lab-crypto-cypher-symmetric
    - sec-lab-crypto-cypher-asymmetric
    - exr-lab-crypto-cypher-asymmetric
    - sec-lab-crypto-sign
    - exr-lab-crypto-sign
    - sec-lab-crypto-key-exchange
    - exr-lab-crypto-key-exchange
    - sec-lab-crypto-cert
    - exr-lab-crypto-cert
    - sec-lab-access-control-ident
    - exr-lab-access-control-ident
    - sec-lab-access-control-authn
    - exr-lab-access-control-authn
    - sec-lab-access-control-password-protection
    - exr-lab-access-control-password-protection
    - sec-lab-access-control-authz-model
    - exr-lab-access-control-authz-model
    - sec-lab-access-control-windows-acl
    - exr-lab-access-control-windows-acl
    - sec-lab-access-control-windows-mic
    - exr-lab-access-control-windows-mic
    - sec-lab-data-integrity-detection
    - exr-lab-data-integrity-detection
