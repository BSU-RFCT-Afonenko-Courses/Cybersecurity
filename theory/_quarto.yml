fail-if-warnings: true
project:
  type: book
  output-dir: _output
  resources:
  - '!**/*.scss'
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!_generated/**'
  - ./_prepared/visualizations/**/static/*.svg
  - ./_prepared/visualizations/**/*.js
  - '!_prepared/**/*.qmd'
  - '!_prepared/bank-fragments/**'
  - '!**/_prepared/bank-fragments/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  pre-render:
  - python3 ../CI/prepare-course-visualizations.py
  - python3 ../CI/cleanup-quarto-mediabag.py
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - python3 ../CI/cleanup-quarto-mediabag.py
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
- course-navigation
- course-visualizations
book:
  navbar:
    title: false
  title: Теория
format:
  html:
    theme: [cosmo, _extensions/Afonenko-Course-Tools/course-theme/theme.scss]
    embed-resources: false
    html-math-method:
      method: mathml
lang: ru
author:
- Афоненко Анатолий
- Войтович Елизавета
bibliography: ../references.bib
reference-catalog:
  namespace: theory
course-navigation:
  enabled: true
