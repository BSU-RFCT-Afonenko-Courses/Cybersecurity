fail-if-warnings: true
project:
  type: book
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  navbar:
    title: Основы кибербезопасности
    logo-href: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/index.html
    left:
    - text: Курс
      href: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/index.html
    - text: Теория
      href: index.html
    - text: Задания и работы
      href: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/task/index.html
    - text: Семинары
      href: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/seminars/index.html
  sidebar:
    tools:
    - icon: house
      href: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/index.html#sec-portal
      text: Навигация курса
  title: Теория
format:
  html:
    theme: cosmo
    html-math-method:
      method: mathjax
lang: ru
author:
- Афоненко Анатолий
- Войтович Елизавета
bibliography: ../references.bib
reference-catalog:
  namespace: theory
