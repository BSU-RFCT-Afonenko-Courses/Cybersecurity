<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="Запись → подтверждение → разрешение">
<desc>Идентификация указывает учётную запись lena. Аутентификация подтверждает зарегистрированное средство входа. Авторизация проверяет конкретное действие, например отправку работы в курс А. Успешный вход не разрешает произвольные операции.</desc>
<rect width="1000" height="206" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#183247">
<rect x="20" y="30" width="290" height="146" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="165.0" y="84.0" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Идентификация</text><text x="165.0" y="115.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">Лена → запись lena</text><text x="165.0" y="143.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">имя заявлено</text><rect x="355" y="30" width="290" height="146" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="500.0" y="84.0" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">Аутентификация</text><text x="500.0" y="115.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">подпись / секрет</text><text x="500.0" y="143.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">вход подтверждён</text><rect x="690" y="30" width="290" height="146" rx="14" fill="#fff5df" stroke="#a86508" stroke-width="2"/><text x="835.0" y="84.0" text-anchor="middle" font-size="26" font-weight="650" fill="#a86508">Авторизация</text><text x="835.0" y="115.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">«Отправить работу»</text><text x="835.0" y="143.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">разрешено в курсе А</text><path d="M322,103 L331.0,103.0" fill="none" stroke="#235eaa" stroke-width="5" stroke-linecap="round"/><polygon points="343,103 331.0,109.0 331.0,97.0" fill="#235eaa"/><path d="M657,103 L666.0,103.0" fill="none" stroke="#087e83" stroke-width="5" stroke-linecap="round"/><polygon points="678,103 666.0,109.0 666.0,97.0" fill="#087e83"/>
</g>
</svg>
