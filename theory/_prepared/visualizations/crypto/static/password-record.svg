<svg xmlns="http://www.w3.org/2000/svg" class="pr-svg" viewBox="0 0 700 575" width="700" height="575" role="img" aria-labelledby="password-description password-detail">
  <title id="password-description">Парольная запись и проверка входа</title>
  <desc id="password-detail">При регистрации пароль, случайная соль и параметры поступают в PBKDF2. Соль, параметры и результат V сохраняются в базе. При входе PBKDF2 вычисляет V′ из введённого пароля и сохранённых соли и параметров; V′ сравнивают с сохранённым V.</desc>
  <style>
    .pr-svg { font-family:system-ui,sans-serif; color:#263440; font-size:16px; }
    .pr-svg .pr-node rect { fill:#f8fafc; stroke:#8b9ba8; stroke-width:1.4; rx:9; }
    .pr-svg text { fill:currentColor; }
    .pr-svg .pr-heading { font-weight:650; font-size:18px; }
    .pr-svg .pr-small { font-size:15px; }
    .pr-svg .pr-code { font-family:ui-monospace,monospace; font-size:15px; }
    .pr-svg .pr-lane { font-size:19px; font-weight:700; }
    .pr-svg .pr-flow { fill:none; stroke:#657b8b; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    .pr-svg .pr-arrowhead { fill:context-stroke; stroke:none; }
    .pr-svg .pr-node.is-active rect { fill:#e3f0fa; stroke:#006b8f; stroke-width:3; }
    .pr-svg .is-active text { fill:#005674; font-weight:650; }
    .pr-svg .pr-flow.is-active, .pr-svg .pr-flow.is-active > path { stroke:#006b8f; stroke-width:7; }
    .pr-svg .pr-flow.is-active .pr-arrowhead { fill:#006b8f; }
    .pr-svg .is-completed.pr-node rect { stroke:#4b8a9e; stroke-width:2; }
    .pr-svg .result-allow.is-active rect { fill:#e5f5ed; stroke:#08763e; }
    .pr-svg .result-allow.is-active text { fill:#08763e; }
    .pr-svg .result-deny.is-active rect { fill:#fff0e8; stroke:#a84916; }
    .pr-svg .result-deny.is-active text { fill:#a84916; }
  </style>
  <defs><marker id="password-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path class="pr-arrowhead" d="M0 0L10 5L0 10Z"/></marker></defs>
  <text class="pr-lane" x="20" y="28">Регистрация</text>
  <text class="pr-lane" x="380" y="28">Вход</text>
  <g id="password" class="pr-node" transform="translate(20 45)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading" data-slot="registered-password">Пароль P</text>
    <text x="14" y="57" class="pr-small">Случайная соль S</text><text x="14" y="85" class="pr-small" data-slot="parameters">Параметры вычисления</text>
  </g>
  <g id="registration" class="pr-node" transform="translate(20 195)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading">PBKDF2(P, S, параметры)</text>
    <text x="14" y="57" class="pr-small">HMAC-SHA-256 · 32 байта</text><text x="14" y="85" class="pr-small">Проверочное значение V</text>
  </g>
  <g id="record" class="pr-node" transform="translate(20 345)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading">Запись в базе</text>
    <text x="14" y="57" class="pr-small">Соль S, алгоритм, параметры</text><text x="14" y="85" class="pr-small">Проверочное значение V</text>
  </g>
  <g id="candidate" class="pr-node" transform="translate(380 45)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading">Введённый пароль P′</text>
    <text x="14" y="65" class="pr-code" data-slot="candidate">P′</text>
  </g>
  <g id="login" class="pr-node" transform="translate(380 195)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading">Та же PBKDF2</text>
    <text x="14" y="57" class="pr-small">P′, сохранённые S и параметры</text><text x="14" y="85" class="pr-code" data-slot="computed">V′</text>
  </g>
  <g id="compare" class="pr-node" transform="translate(380 345)">
    <rect width="300" height="110"/><text x="14" y="29" class="pr-heading">Сравнение V′ с V</text>
    <text x="14" y="60" class="pr-small" data-slot="verdict">Совпадение разрешает вход</text><text x="14" y="88" class="pr-small">Сравнивают все 32 байта</text>
  </g>
  <g id="registration-derive" class="pr-flow"><path d="M170 155V183" marker-end="url(#password-arrow)"/></g>
  <g id="registration-save" class="pr-flow"><path d="M170 305V333" marker-end="url(#password-arrow)"/></g>
  <g id="login-derive" class="pr-flow"><path d="M530 155V183" marker-end="url(#password-arrow)"/></g>
  <g id="compare-values" class="pr-flow"><path d="M530 305V333" marker-end="url(#password-arrow)"/></g>
  <g id="read" class="pr-flow"><path d="M320 385H344V250H368" marker-end="url(#password-arrow)"/><path d="M320 415H368" marker-end="url(#password-arrow)"/></g>
  <text x="350" y="509" text-anchor="middle" class="pr-small">Из базы: соль и параметры для вычисления, V для сравнения</text>
</svg>
