<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="desc">
<desc id="desc">Четыре независимых 32-байтовых секрета a0, a1, b0, b1 составляют SK. К каждому применяют H=SHA-256; реальные хеши A, B, C, D составляют открытый ключ PK. Показаны первые 12 шестнадцатеричных знаков значений.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
 <pattern id="hidden" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f8fafc"/><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#cbd5e1" stroke-width="2"/></pattern>
 <style>
  text {font-family:"DejaVu Sans",sans-serif;font-size:26px;fill:#172b46}
  .label {font-size:28px;font-weight:700}
  .key {font-size:30px;font-weight:700}
  .hex {font-family:"DejaVu Sans Mono",monospace;font-size:26px}
  .cell {fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.8}
  .public {fill:#e9f1ff;stroke:#486caa;stroke-width:1.8}
  .selected {fill:#dcf4e8;stroke:#13795b;stroke-width:2.5}
  .unknown {fill:url(#hidden);stroke:#94a3b8;stroke-width:1.8}
  .arrow {fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
  .valid {fill:#13795b;font-size:32px;font-weight:700}
 </style>
</defs>
<rect width="1200" height="400" fill="white"/>
<text x="245" y="40" class="label" text-anchor="middle">Закрытый ключ SK</text>
<text x="955" y="40" class="label" text-anchor="middle">Открытый ключ PK</text>
<rect x="25" y="72" width="440" height="53" rx="10" class="cell"/>
<text x="45" y="107" class="key" text-anchor="start">a₀</text>
<text x="128" y="107" class="hex" text-anchor="start">4a37d2d871bf…</text>
<rect x="735" y="72" width="440" height="53" rx="10" class="public"/>
<text x="752" y="107" class="" text-anchor="start">A = H(a₀)</text>
<text x="944" y="107" class="hex" text-anchor="start">8c65d22c3ef3…</text>
<rect x="25" y="137" width="440" height="53" rx="10" class="cell"/>
<text x="45" y="172" class="key" text-anchor="start">a₁</text>
<text x="128" y="172" class="hex" text-anchor="start">4f78bf6b3939…</text>
<rect x="735" y="137" width="440" height="53" rx="10" class="public"/>
<text x="752" y="172" class="" text-anchor="start">B = H(a₁)</text>
<text x="944" y="172" class="hex" text-anchor="start">b0c97fcb35dc…</text>
<rect x="25" y="202" width="440" height="53" rx="10" class="cell"/>
<text x="45" y="237" class="key" text-anchor="start">b₀</text>
<text x="128" y="237" class="hex" text-anchor="start">1b1bc2d9bc95…</text>
<rect x="735" y="202" width="440" height="53" rx="10" class="public"/>
<text x="752" y="237" class="" text-anchor="start">C = H(b₀)</text>
<text x="944" y="237" class="hex" text-anchor="start">f66bc800899d…</text>
<rect x="25" y="267" width="440" height="53" rx="10" class="cell"/>
<text x="45" y="302" class="key" text-anchor="start">b₁</text>
<text x="128" y="302" class="hex" text-anchor="start">95a2092f6d82…</text>
<rect x="735" y="267" width="440" height="53" rx="10" class="public"/>
<text x="752" y="302" class="" text-anchor="start">D = H(b₁)</text>
<text x="944" y="302" class="hex" text-anchor="start">bc3a1c10293a…</text>
<path d="M490,200 L700,200" class="arrow"/>
<text x="590" y="178" class="key" text-anchor="middle">H</text>
<text x="590" y="250" class="" text-anchor="middle">для каждого</text>
<text x="590" y="285" class="" text-anchor="middle">секрета</text>
<text x="25" y="380" class="" text-anchor="start">Начала 32-байтовых значений</text>
</svg>
