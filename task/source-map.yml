описание: Историческая карта переноса исходников банка и работ; идентификаторы задач, решений и работ сохранены.
оформление: Класс answers-expanded и filters/answer-presentation.lua сохраняют раскрытие КЦД и пяти блоков материалов
  демонстрационной работы. Фильтр меняет только оформление после course-core и course-presentation; правила видимости
  остаются прежними.
черновики: drafts/ не входит в оглавления; собственный _quarto.yml исключает все QMD из публикации и из банка задач.
