fail-if-warnings: true
project:
  type: book
  output-dir: _output
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  resources:
  - '!**/*.scss'
  - '!**/*.qmd'
  - ./assets/**
  - '!materials/**'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- project-download
- reference-catalog
- course-navigation
book:
  navbar: {}
  title: Задания
author:
- Афоненко Анатолий
- Войтович Елизавета
date: today
lang: ru
bibliography: ../references.bib
format:
  html:
    theme: [cosmo, _extensions/Afonenko-Course-Tools/course-theme/theme.scss]
    html-math-method: mathml
    embed-resources: false
reference-catalog:
  namespace: tasks
course-navigation:
  enabled: true
