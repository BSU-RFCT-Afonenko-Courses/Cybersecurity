fail-if-warnings: true
project:
  type: book
  output-dir: _output
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  resources:
  - '!**/*.scss'
  - '!**/*.qmd'
  - ./assets/**
  - '!materials/**'
  - '!drafts/**'
  - '!filters/**'
  - '!source-map.yml'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- filters/answer-presentation.lua
- project-download
- reference-catalog
book:
  title: Задания
author:
- Афоненко Анатолий
- Войтович Елизавета
date: today
lang: ru
bibliography: ../references.bib
format:
  html:
    html-math-method: mathml
    embed-resources: false
    theme:
    - cosmo
    - styles/offline-fonts.scss
reference-catalog:
  namespace: tasks
metadata-files:
- ../_navigation.yml
