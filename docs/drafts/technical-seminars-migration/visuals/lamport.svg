<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="desc">
  <desc id="desc">Двухбитовая модель Лэмпорта: выбор a1 и b0 для сообщения 10, проверки H(a1)=B и H(b0)=C; дополнительная подпись 01 раскрывает a0 и b1. Открытый ключ состоит из A, B, C, D.</desc>
  <view id="signing" viewBox="0 0 1440 420"/>
  <view id="disclosure" viewBox="0 440 1440 380"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <pattern id="hidden" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#cbd5e1" stroke-width="2"/></pattern>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; font-size: 23px; fill: #172b46; }
      .small { font-size: 20px; }
      .label { font-size: 25px; font-weight: 700; }
      .symbol { font-family: "DejaVu Sans Mono", monospace; font-size: 28px; }
      .cell { stroke: #94a3b8; stroke-width: 1.5; }
      .secret { fill: #f1f5f9; }
      .exposed { fill: #d9f3e8; stroke: #13795b; stroke-width: 2; }
      .public { fill: #e9f1ff; stroke: #486caa; stroke-width: 1.5; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1440" height="820" fill="#fff"/>

  <text x="30" y="40" class="label">Закрытая часть</text>
  <text x="80" y="83" class="small">бит 0</text><text x="208" y="83" class="small">бит 1</text>
  <g class="cell secret">
    <rect x="45" y="120" width="116" height="80" rx="8"/>
    <rect x="175" y="120" width="116" height="80" rx="8" class="exposed"/>
    <rect x="45" y="236" width="116" height="80" rx="8" class="exposed"/>
    <rect x="175" y="236" width="116" height="80" rx="8"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="103" y="170">a₀</text><text x="233" y="170">a₁</text>
    <text x="103" y="286">b₀</text><text x="233" y="286">b₁</text>
  </g>
  <text x="45" y="355" class="small">Независимые случайные</text><text x="45" y="385" class="small">секреты</text>
  <path d="M292,220 L350,220" class="line"/>
  <text x="315" y="205" class="symbol">H</text>

  <text x="366" y="40" class="label">Открытая часть</text>
  <text x="395" y="83" class="small">бит 0</text><text x="525" y="83" class="small">бит 1</text>
  <g class="public">
    <rect x="360" y="120" width="116" height="80" rx="8"/><rect x="490" y="120" width="116" height="80" rx="8"/>
    <rect x="360" y="236" width="116" height="80" rx="8"/><rect x="490" y="236" width="116" height="80" rx="8"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="418" y="170">A</text><text x="548" y="170">B</text>
    <text x="418" y="286">C</text><text x="548" y="286">D</text>
  </g>
  <text x="364" y="355" class="small">A = H(a₀), B = H(a₁)</text>
  <text x="364" y="385" class="small">C = H(b₀), D = H(b₁)</text>

  <text x="670" y="40" class="label">Сообщение выбирает по одной части</text>
  <g text-anchor="middle">
    <text x="790" y="100" class="symbol">1</text><text x="1110" y="100" class="symbol">0</text>
    <path d="M790,113 L790,148" class="line"/><path d="M1110,113 L1110,148" class="line"/>
    <rect x="720" y="156" width="140" height="80" rx="8" class="exposed"/><rect x="1040" y="156" width="140" height="80" rx="8" class="exposed"/>
    <text x="790" y="206" class="symbol">a₁</text><text x="1110" y="206" class="symbol">b₀</text>
    <path d="M790,239 L790,278" class="line"/><path d="M1110,239 L1110,278" class="line"/>
    <text x="790" y="315" class="small">H(a₁) = B</text><text x="1110" y="315" class="small">H(b₀) = C</text>
    <text x="790" y="352" class="small">позиция 1, бит 1</text><text x="1110" y="352" class="small">позиция 2, бит 0</text>
  </g>
  <text x="1285" y="206" class="small">подпись</text>
  <text x="1285" y="313" class="small">обе</text><text x="1285" y="341" class="small">совпали ✓</text>
  <text x="670" y="395" class="small">Получателю переданы 10, (a₁, b₀) и открытая часть.</text>

  <path d="M30,430 H1410" stroke="#cbd5e1" stroke-width="2"/>
  <text x="30" y="474" class="label">Какие секреты стали общедоступны</text>
  <text x="212" y="520" class="small">После подписи 10</text><text x="865" y="520" class="small">После подписи 10, затем 01</text>
  <text x="48" y="560" class="small">позиция</text><text x="230" y="560" class="small">0</text><text x="368" y="560" class="small">1</text>
  <text x="880" y="560" class="small">0</text><text x="1018" y="560" class="small">1</text>
  <g text-anchor="middle" class="small">
    <text x="90" y="612">1</text><text x="90" y="692">2</text>
  </g>
  <g>
    <rect x="174" y="574" width="120" height="60" rx="6" fill="url(#hidden)" class="cell"/><rect x="312" y="574" width="120" height="60" rx="6" class="exposed"/>
    <rect x="174" y="654" width="120" height="60" rx="6" class="exposed"/><rect x="312" y="654" width="120" height="60" rx="6" fill="url(#hidden)" class="cell"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="234" y="614">?</text><text x="372" y="614">a₁</text>
    <text x="234" y="694">b₀</text><text x="372" y="694">?</text>
  </g>
  <path d="M490,650 L760,650" class="line"/>
  <text x="505" y="596" class="small">Подпись 01 раскрыла</text><text x="570" y="626" class="symbol">a₀, b₁</text>
  <g class="exposed">
    <rect x="824" y="574" width="120" height="60" rx="6"/><rect x="962" y="574" width="120" height="60" rx="6"/>
    <rect x="824" y="654" width="120" height="60" rx="6"/><rect x="962" y="654" width="120" height="60" rx="6"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="884" y="614">a₀</text><text x="1022" y="614">a₁</text>
    <text x="884" y="694">b₀</text><text x="1022" y="694">b₁</text>
  </g>
  <text x="1120" y="600" class="small">Открыты обе ячейки</text><text x="1120" y="630" class="small">каждой позиции.</text>
  <text x="1120" y="672" class="small">Новый секрет</text><text x="1120" y="702" class="small">искать не требуется.</text>
  <rect x="35" y="771" width="24" height="24" class="exposed"/><text x="72" y="790" class="small">раскрыто подписью</text>
  <rect x="425" y="771" width="24" height="24" fill="url(#hidden)" class="cell"/><text x="462" y="790" class="small">осталось неизвестным получателю</text>
</svg>
