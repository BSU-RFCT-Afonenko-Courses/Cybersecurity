<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Текущее состояние и прошлое</title><desc id="desc">Зеркало после записи отчёта₂ и удаления плана одинаково на двух дисках. Отдельная копия пятницы сохраняет отчёт₁ и план₁.</desc>
<rect width="1200" height="490" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6378"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" fill="#172d46">
<rect x="20" y="20" width="698" height="304" rx="10" fill="#fbfcfe" stroke="#cad5df" stroke-width="2"/>
<text x="45" y="58" font-size="23" fill="#172d46" font-weight="bold" text-anchor="start">После записи отчёта₂ и удаления плана</text>
<rect x="45" y="83" width="300" height="205" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<text x="195" y="119" font-size="22" fill="#1769aa" font-weight="bold" text-anchor="middle">Диск 1</text>
<rect x="67" y="138" width="256" height="52" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
<text x="195" y="172" font-size="24" fill="#15724e" font-weight="bold" text-anchor="middle">Отчёт₂</text>
<rect x="67" y="209" width="256" height="52" rx="10" fill="#f1f3f6" stroke="#cad5df" stroke-width="2"/>
<text x="195" y="243" font-size="23" fill="#4e6378" font-weight="normal" text-anchor="middle">Плана нет</text>
<rect x="391" y="83" width="300" height="205" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<text x="541" y="119" font-size="22" fill="#1769aa" font-weight="bold" text-anchor="middle">Диск 2</text>
<rect x="413" y="138" width="256" height="52" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
<text x="541" y="172" font-size="24" fill="#15724e" font-weight="bold" text-anchor="middle">Отчёт₂</text>
<rect x="413" y="209" width="256" height="52" rx="10" fill="#f1f3f6" stroke="#cad5df" stroke-width="2"/>
<text x="541" y="243" font-size="23" fill="#4e6378" font-weight="normal" text-anchor="middle">Плана нет</text>
<rect x="751" y="20" width="429" height="304" rx="10" fill="#fffdf8" stroke="#97651d" stroke-width="2"/>
<text x="965" y="58" font-size="23" fill="#97651d" font-weight="bold" text-anchor="middle">Отдельная копия пятницы</text>
<rect x="777" y="100" width="377" height="62" rx="10" fill="#fff7e7" stroke="#97651d" stroke-width="2"/>
<text x="965" y="140" font-size="24" fill="#97651d" font-weight="normal" text-anchor="middle">Отчёт₁</text>
<rect x="777" y="194" width="377" height="62" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
<text x="965" y="234" font-size="24" fill="#15724e" font-weight="bold" text-anchor="middle">План₁</text>
<path d="M368 335 L368 369" fill="none" stroke="#4e6378" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M965 335 L965 369" fill="none" stroke="#4e6378" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="383" width="646" height="76" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
<text x="368" y="414" font-size="23" fill="#15724e" font-weight="bold" text-anchor="middle">Отказ одного диска</text>
<text x="368" y="443" font-size="22" fill="#15724e" font-weight="normal" text-anchor="middle">Текущий отчёт₂ читается с другого</text>
<rect x="751" y="383" width="429" height="76" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
<text x="965" y="414" font-size="21" fill="#15724e" font-weight="bold" text-anchor="middle">Возврат сохранённого плана₁</text>
<text x="965" y="443" font-size="21" fill="#15724e" font-weight="normal" text-anchor="middle">Источник — копия пятницы</text>
</g>
</svg>
