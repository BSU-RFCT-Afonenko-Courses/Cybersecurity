<text x="638" y="495" font-size="21" fill="#15724e" font-weight="normal" text-anchor="start">Источники: Ср · Вт · Вс</text>
<rect x="618" y="539" width="543" height="71" rx="10" fill="#fff0ef" stroke="#b13532" stroke-width="2"/>
<text x="638" y="568" font-size="23" fill="#b13532" font-weight="bold" text-anchor="start">Вторник: A₁ · B₁ · C₀</text>
<text x="638" y="596" font-size="21" fill="#b13532" font-weight="normal" text-anchor="start">A₁ нет в доступных копиях</text>
