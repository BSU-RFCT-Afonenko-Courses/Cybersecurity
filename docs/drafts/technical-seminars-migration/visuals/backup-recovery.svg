<rect x="38" y="225" width="222" height="105" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<rect x="289" y="225" width="262" height="105" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<text x="149" y="258" font-size="21" fill="#172d46" font-weight="bold" text-anchor="middle">Воскресенье</text>
<text x="149" y="297" font-size="22" fill="#172d46" font-weight="normal" text-anchor="middle">A₀ · B₀ · C₀</text>
<text x="420" y="258" font-size="21" fill="#172d46" font-weight="bold" text-anchor="middle">Вторник</text>
<text x="420" y="297" font-size="22" fill="#172d46" font-weight="normal" text-anchor="middle">A₁ · B₁</text>
<path d="M149 336 L149 363" fill="none" stroke="#4e6378" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M420 336 L420 363" fill="none" stroke="#4e6378" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="149" y="391" font-size="22" fill="#15724e" font-weight="normal" text-anchor="middle">Берём C₀</text>
<text x="420" y="391" font-size="22" fill="#15724e" font-weight="normal" text-anchor="middle">Берём A₁ и B₁</text>
<text x="38" y="438" font-size="22" fill="#172d46" font-weight="bold" text-anchor="start">Набор 2</text>
<rect x="38" y="454" width="222" height="105" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<rect x="289" y="454" width="262" height="105" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<text x="149" y="487" font-size="21" fill="#172d46" font-weight="bold" text-anchor="middle">Воскресенье</text>
