<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Источники целевых версий</title><desc id="desc">Слева две дифференциальные альтернативы для вторника. Справа потерян понедельник инкрементной схемы A, B, A; среда достижима, вторнику недостаёт A₁.</desc>
<rect width="1200" height="650" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6378"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" fill="#172d46">
<rect x="15" y="15" width="560" height="620" rx="10" fill="#fbfcfe" stroke="#cad5df" stroke-width="2"/>
<rect x="595" y="15" width="590" height="620" rx="10" fill="#fbfcfe" stroke="#cad5df" stroke-width="2"/>
<text x="38" y="52" font-size="25" fill="#172d46" font-weight="bold" text-anchor="start">Правки A → B → C</text>
