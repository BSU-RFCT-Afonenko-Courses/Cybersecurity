<text x="294" y="603" font-size="22" fill="#4e6378" font-weight="normal" text-anchor="middle">C₁ остаётся в копии среды</text>
<text x="618" y="52" font-size="25" fill="#172d46" font-weight="bold" text-anchor="start">Правки A → B → A</text>
