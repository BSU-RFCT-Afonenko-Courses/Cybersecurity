<text x="1138" y="353" font-size="23" fill="#172d46" font-weight="normal" text-anchor="end">A₂</text>
<path d="M892 390 L892 420" fill="none" stroke="#4e6378" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="618" y="432" width="543" height="81" rx="10" fill="#eaf7f0" stroke="#15724e" stroke-width="2"/>
