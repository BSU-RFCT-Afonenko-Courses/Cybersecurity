<rect x="618" y="248" width="543" height="56" rx="10" fill="#edf5fc" stroke="#cad5df" stroke-width="2"/>
<text x="634" y="284" font-size="21" fill="#172d46" font-weight="bold" text-anchor="start">Вторник</text>
<text x="1138" y="284" font-size="23" fill="#172d46" font-weight="normal" text-anchor="end">B₁</text>
