<rect x="430" y="321" width="56" height="56" rx="10" fill="#fff0ef" stroke="#b13532" stroke-width="2"/>
<text x="458" y="359" font-size="28" fill="#b13532" font-weight="bold" text-anchor="middle">0</text>
