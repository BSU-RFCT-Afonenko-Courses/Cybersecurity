<text x="525" y="359" font-size="28" fill="#b13532" font-weight="bold" text-anchor="middle">0</text>
<text x="430" y="413" font-size="20" fill="#b13532" font-weight="normal" text-anchor="start">Ошибка не обнаружена</text>
<rect x="842" y="321" width="56" height="56" rx="10" fill="#fff0ef" stroke="#b13532" stroke-width="2"/>
<text x="870" y="359" font-size="28" fill="#b13532" font-weight="bold" text-anchor="middle">0</text>
<rect x="909" y="321" width="56" height="56" rx="10" fill="#fff0ef" stroke="#b13532" stroke-width="2"/>
<text x="937" y="359" font-size="28" fill="#b13532" font-weight="bold" text-anchor="middle">0</text>
<rect x="976" y="321" width="56" height="56" rx="10" fill="#fff0ef" stroke="#b13532" stroke-width="2"/>
<text x="1004" y="359" font-size="28" fill="#b13532" font-weight="bold" text-anchor="middle">1</text>
<text x="842" y="413" font-size="20" fill="#b13532" font-weight="normal" text-anchor="start">Результат 0: неверно</text>
<path d="M15 437 L1185 437" fill="none" stroke="#cad5df" stroke-width="2.5"/>
<text x="600" y="466" font-size="20" fill="#4e6378" font-weight="normal" text-anchor="middle">Модель: не более одной инверсии в целом кодовом слове</text>
</g>
</svg>
