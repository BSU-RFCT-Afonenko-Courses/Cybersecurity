<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc">
<title id="title">Предварительные кандидаты К4: контроль ошибки</title><desc id="desc">Для исходного бита 1 сравниваются чётность и тройное повторение при нуле, одной и двух инверсиях. Две инверсии вне основной модели одной ошибки.</desc>
<rect width="1200" height="475" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6378"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" fill="#172d46">
<text x="20" y="35" font-size="24" fill="#172d46" font-weight="bold" text-anchor="start">Исходный бит: 1</text>
<text x="440" y="35" font-size="23" fill="#172d46" font-weight="bold" text-anchor="start">Чётное число единиц</text>
<text x="831" y="35" font-size="23" fill="#172d46" font-weight="bold" text-anchor="start">Большинство трёх битов</text>
<path d="M15 58 L1185 58" fill="none" stroke="#cad5df" stroke-width="2.5"/>
<text x="20" y="123" font-size="23" fill="#172d46" font-weight="bold" text-anchor="start">Без ошибки</text>
<rect x="430" y="83" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="458" y="121" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<rect x="497" y="83" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="525" y="121" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<text x="430" y="175" font-size="20" fill="#15724e" font-weight="normal" text-anchor="start">Проверка проходит</text>
<rect x="842" y="83" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="870" y="121" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<rect x="909" y="83" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="937" y="121" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<rect x="976" y="83" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="1004" y="121" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<text x="842" y="175" font-size="20" fill="#15724e" font-weight="normal" text-anchor="start">Результат 1</text>
<text x="20" y="242" font-size="23" fill="#172d46" font-weight="bold" text-anchor="start">Одна инверсия</text>
<rect x="430" y="202" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="458" y="240" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<rect x="497" y="202" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="525" y="240" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">0</text>
<text x="430" y="294" font-size="20" fill="#15724e" font-weight="normal" text-anchor="start">Ошибка обнаружена</text>
<rect x="842" y="202" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="870" y="240" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<rect x="909" y="202" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="937" y="240" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">0</text>
<rect x="976" y="202" width="56" height="56" rx="10" fill="#edf5fc" stroke="#1769aa" stroke-width="2"/>
<text x="1004" y="240" font-size="28" fill="#1769aa" font-weight="bold" text-anchor="middle">1</text>
<text x="842" y="294" font-size="20" fill="#15724e" font-weight="normal" text-anchor="start">Результат 1: исправлено</text>
<text x="20" y="361" font-size="23" fill="#b13532" font-weight="bold" text-anchor="start">Две инверсии</text>
