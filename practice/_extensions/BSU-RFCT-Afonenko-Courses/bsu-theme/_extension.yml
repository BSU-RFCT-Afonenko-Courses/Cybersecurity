title: Тема БГУ
author: Анатолий Афоненко
version: 0.2.0
quarto-required: ">=1.10.0"
# Пакет оформления включается явно в проекте курса.
# Форматы, фильтры и контракты оценивания определяются отдельно.
contributes:
  metadata:
    # Описание ресурсов позволяет установить пакет без автоматической
    # замены формата, темы, обработчиков и содержимого проекта.
    bsu-theme:
      brand: _brand.yml
      styles:
        common: styles/common.scss
        html: styles/book.scss
        revealjs: styles/slides.scss
