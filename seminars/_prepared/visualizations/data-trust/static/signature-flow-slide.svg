<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" role="img" aria-labelledby="desc">
<desc id="desc">Издатель подписывает сообщение m закрытым ключом SK, получая подпись s. Получатель проверяет сообщение m и подпись s открытым ключом PK издателя; результат — успех или отказ.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#304860"/></marker><style>text{font:28px 'DejaVu Sans',sans-serif;fill:#172b46}.bold{font-weight:700}.box{fill:#e6f4ef;stroke:#338568;stroke-width:3}.data{fill:#f0f6ff;stroke:#6585ad;stroke-width:3}.line{fill:none;stroke:#304860;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1440" height="340" fill="white"/>
<text x="35" y="37" class="bold">Издатель</text><text x="1010" y="37" class="bold">Получатель</text>
<rect class="data" x="30" y="65" width="240" height="72" rx="12"/><text x="55" y="110">Сообщение m</text>
<rect class="data" x="30" y="220" width="240" height="72" rx="12"/><text x="56" y="265">Ключ SK</text>
<rect class="box" x="330" y="138" width="280" height="82" rx="12"/><text x="358" y="189">Sign(SK, m)</text>
<path class="line" d="M270 101 H300 V160 H320 M270 256 H300 V200 H320"/>
<rect class="data" x="675" y="138" width="220" height="82" rx="12"/><text x="700" y="189">Подпись s</text><path class="line" d="M610 179 H665"/>
<rect class="box" x="1015" y="138" width="355" height="82" rx="12"/><text x="1036" y="189">Verify(PK, m, s)</text>
<path class="line" d="M895 179 H1005 M150 65 V50 H950 V156 H1005"/>
<rect class="data" x="1020" y="235" width="245" height="70" rx="12"/><text x="1040" y="280">Ключ PK</text><path class="line" d="M1142 235 V226"/>
<path class="line" d="M1290 138 V101"/><text x="1100" y="90">Успех или отказ</text>
</svg>
