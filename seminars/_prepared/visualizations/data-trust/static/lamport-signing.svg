<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="desc">
<desc id="desc">Учебные две позиции d=10 выбирают a1 из первой позиции SK и b0 из второй. Подпись s состоит из этих двух строк байтов; d не входит в неё как часть секрета. Не выбранные a0 и b1 показаны штриховкой. Показаны начала 32-байтовых значений.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
 <pattern id="hidden" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f8fafc"/><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#cbd5e1" stroke-width="2"/></pattern>
 <style>
  text {font-family:"DejaVu Sans",sans-serif;font-size:26px;fill:#172b46}
  .label {font-size:28px;font-weight:700}
  .key {font-size:30px;font-weight:700}
  .hex {font-family:"DejaVu Sans Mono",monospace;font-size:26px}
  .cell {fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.8}
  .public {fill:#e9f1ff;stroke:#486caa;stroke-width:1.8}
  .selected {fill:#dcf4e8;stroke:#13795b;stroke-width:2.5}
  .unknown {fill:url(#hidden);stroke:#94a3b8;stroke-width:1.8}
  .arrow {fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
  .valid {fill:#13795b;font-size:32px;font-weight:700}
 </style>
</defs>
<rect width="1200" height="400" fill="white"/>
<text x="315" y="40" class="label" text-anchor="middle">Закрытый ключ SK</text>
<text x="203" y="85" class="" text-anchor="middle">бит 0</text>
<text x="443" y="85" class="" text-anchor="middle">бит 1</text>
<text x="980" y="40" class="label" text-anchor="middle">Подпись s = (a₁, b₀)</text>
<text x="42" y="170" class="key" text-anchor="middle">1</text>
<rect x="95" y="110" width="215" height="100" rx="10" class="unknown"/>
<text x="202" y="146" class="key" text-anchor="middle">a₀</text>
<text x="202" y="189" class="hex" text-anchor="middle">4a37d2d871…</text>
<rect x="335" y="110" width="215" height="100" rx="10" class="selected"/>
<text x="442" y="146" class="key" text-anchor="middle">a₁</text>
<text x="442" y="189" class="hex" text-anchor="middle">4f78bf6b39…</text>
<text x="42" y="290" class="key" text-anchor="middle">2</text>
<rect x="95" y="230" width="215" height="100" rx="10" class="selected"/>
<text x="202" y="266" class="key" text-anchor="middle">b₀</text>
<text x="202" y="309" class="hex" text-anchor="middle">1b1bc2d9bc…</text>
<rect x="335" y="230" width="215" height="100" rx="10" class="unknown"/>
<text x="442" y="266" class="key" text-anchor="middle">b₁</text>
<text x="442" y="309" class="hex" text-anchor="middle">95a2092f6d…</text>
<rect x="790" y="110" width="385" height="100" rx="10" class="selected"/>
<text x="982" y="146" class="key" text-anchor="middle">a₁</text>
<text x="982" y="189" class="hex" text-anchor="middle">4f78bf6b3939…</text>
<rect x="790" y="230" width="385" height="100" rx="10" class="selected"/>
<text x="982" y="266" class="key" text-anchor="middle">b₀</text>
<text x="982" y="309" class="hex" text-anchor="middle">1b1bc2d9bc95…</text>
<text x="665" y="160" class="key" text-anchor="middle">d = 10</text>
<path d="M580,210 L750,210" class="arrow"/>
<text x="665" y="262" class="" text-anchor="middle">выбор</text>
<text x="25" y="380" class="" text-anchor="start">Начала 32-байтовых значений</text>
</svg>
