<svg xmlns="http://www.w3.org/2000/svg" class="pr-svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="password-slide-desc"><desc id="password-slide-desc">При регистрации из пароля, новой соли и параметров вычисляется проверочное значение. В базе сохраняются соль, параметры и результат. При входе вычисление повторяется с введённым паролем; результаты сравнивают.</desc><style>
    .pr-svg { font-family:system-ui,sans-serif; color:#263440; font-size:16px; }
    .pr-svg .pr-node rect { fill:#f8fafc; stroke:#8b9ba8; stroke-width:1.4; rx:9; }
    .pr-svg text { fill:currentColor; }
    .pr-svg .pr-heading { font-weight:650; font-size:18px; }
    .pr-svg .pr-small { font-size:15px; }
    .pr-svg .pr-code { font-family:ui-monospace,monospace; font-size:15px; }
    .pr-svg .pr-lane { font-size:19px; font-weight:700; }
    .pr-svg .pr-flow { fill:none; stroke:#657b8b; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    .pr-svg .pr-arrowhead { fill:context-stroke; stroke:none; }
    .pr-svg .pr-node.is-active rect { fill:#e3f0fa; stroke:#006b8f; stroke-width:3; }
    .pr-svg .is-active text { fill:#005674; font-weight:650; }
    .pr-svg .pr-flow.is-active, .pr-svg .pr-flow.is-active &gt; path { stroke:#006b8f; stroke-width:7; }
    .pr-svg .pr-flow.is-active .pr-arrowhead { fill:#006b8f; }
    .pr-svg .is-completed.pr-node rect { stroke:#4b8a9e; stroke-width:2; }
    .pr-svg .result-allow.is-active rect { fill:#e5f5ed; stroke:#08763e; }
    .pr-svg .result-allow.is-active text { fill:#08763e; }
    .pr-svg .result-deny.is-active rect { fill:#fff0e8; stroke:#a84916; }
    .pr-svg .result-deny.is-active text { fill:#a84916; }
  
.pr-svg {font-size:21px} .pr-svg .pr-heading {font-size:22px} .pr-svg .pr-small {font-size:20px} .pr-svg .pr-lane {font-size:25px} .pr-svg .pr-action rect {fill:#fff5df;stroke:#987326;rx:24} .pr-svg .pr-data rect {fill:#eef2f6;rx:6}
</style>
  <defs><marker id="password-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path class="pr-arrowhead" d="M0 0L10 5L0 10Z" /></marker></defs>
  <text x="20" y="32" class="pr-lane">Регистрация</text><g class="pr-node pr-data" transform="translate(20 55)"><rect width="250" height="115" /><text x="16" y="30" class="pr-heading">Выбранный пароль</text><text x="16" y="61" class="pr-small">Новая случайная соль</text><text x="16" y="88" class="pr-small">Параметры вычисления</text></g><g class="pr-node pr-action" transform="translate(340 55)"><rect width="275" height="115" /><text x="16" y="30" class="pr-heading">Парольная функция</text><text x="16" y="61" class="pr-small">Пароль + соль + параметры</text><text x="16" y="88" class="pr-small">→ проверочное значение</text></g><g class="pr-node pr-data" transform="translate(740 55)"><rect width="410" height="115" /><text x="16" y="30" class="pr-heading">Запись в базе</text><text x="16" y="61" class="pr-small">Соль, алгоритм, параметры</text><text x="16" y="88" class="pr-small">Проверочное значение</text></g><path d="M270 112H325" class="pr-flow" marker-end="url(#password-arrow)" /><path d="M615 112H725" class="pr-flow" marker-end="url(#password-arrow)" /><text x="20" y="254" class="pr-lane">Вход</text><g class="pr-node pr-data" transform="translate(20 278)"><rect width="250" height="115" /><text x="16" y="30" class="pr-heading">Введённый пароль</text></g><g class="pr-node pr-action" transform="translate(340 278)"><rect width="275" height="115" /><text x="16" y="30" class="pr-heading">Та же функция</text><text x="16" y="61" class="pr-small">Сохранённые соль</text><text x="16" y="88" class="pr-small">и параметры</text></g><g class="pr-node pr-action" transform="translate(740 278)"><rect width="410" height="115" /><text x="16" y="30" class="pr-heading">Сравнение результатов</text><text x="16" y="61" class="pr-small">Новый результат = сохранённый?</text><text x="16" y="88" class="pr-small">Да — пароль принят; нет — отклонён</text></g><path d="M270 335H325" class="pr-flow" marker-end="url(#password-arrow)" /><path d="M615 335H725" class="pr-flow" marker-end="url(#password-arrow)" /><path d="M880 170V210H478V262" class="pr-flow" marker-end="url(#password-arrow)" /><text x="650" y="202" class="pr-small" text-anchor="middle">Соль и параметры</text><path d="M1060 170V262" class="pr-flow" marker-end="url(#password-arrow)" /><text x="1082" y="232" class="pr-small">Эталон</text><!--Подпись и номер рисунка задаются в QMD средствами Quarto.--></svg>