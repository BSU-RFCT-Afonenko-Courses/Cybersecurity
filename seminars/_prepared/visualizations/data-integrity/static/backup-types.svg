<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="535" viewBox="0 0 1440 535" role="img" aria-labelledby="description">
<desc id="description">По горизонтали время: воскресенье, понедельник, вторник. В понедельник изменяется A, во вторник B. Полные копии каждый раз содержат все три файла; инкрементные после воскресенья содержат A₁, затем B₁; дифференциальные — A₁, затем A₁ и B₁. В каждом столбце файлы размещены внутри отдельной копии. Стрелки связывают копию с той, после которой отсчитываются изменения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5a7183"/></marker></defs>
