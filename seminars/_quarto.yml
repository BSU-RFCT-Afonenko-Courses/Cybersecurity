fail-if-warnings: true
project:
  type: website
  render:
  - index.qmd
  - 01-introduction.qmd
  - 02-legal-requirements.qmd
  - 03-standards-risk.qmd
  - 04-access-control.qmd
  - 05-crypto.qmd
  - 06-data-integrity.qmd
  - 07-signature-trust.qmd
  output-dir: _output
  resources:
  - control-demo.html
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!**/_*.qmd'
  - '!_generated/**'
  - ./_prepared/visualizations/**/static/*.svg
  - ./_prepared/visualizations/**/*.js
  - '!_prepared/**/*.qmd'
  - '!_prepared/bank-fragments/**'
  - '!**/_prepared/bank-fragments/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  pre-render:
  - python3 ../CI/prepare-course-visualizations.py
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
- ../filters/access-examples.lua
- course-visualizations
format:
  revealjs:
    html-math-method: mathml
    embed-resources: false
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins:
    - course-navigation
    pdf-separate-fragments: false
website:
  title: Семинары — Основы кибербезопасности
course-navigation:
  course-url: https://bsu-rfct-afonenko-courses.github.io/Cybersecurity/
bibliography: ../references.bib
lang: ru
author:
- Афоненко Анатолий
- Войтович Елизавета
reference-catalog:
  namespace: practice
metadata-files:
- ../_navigation.yml
