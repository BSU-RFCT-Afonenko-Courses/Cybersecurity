fail-if-warnings: true
project:
  type: website
  render:
  - index.qmd
  - 01-introduction.qmd
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/_extensions/**'
  - '!**/_generated/**'
  - '!**/_site-full/**'
  - '!**/_site-student/**'
  - '!**/_output/**'
  - '!**/.quarto/**'
  - '!**/_freeze/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
format:
  revealjs:
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins:
    - course-navigation
    pdf-separate-fragments: false
bibliography: ../references.bib
lang: ru
reference-catalog:
  namespace: practice
