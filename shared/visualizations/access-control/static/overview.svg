<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="1000" height="375" role="img" aria-label="Кто — к чему — какое действие">
<desc>Процесс пользователя передаёт запрос монитору доступа. Монитор применяет политику. Разрешённая операция проходит к объекту; отказ останавливает запрос до объекта.</desc>
<rect width="1000" height="375" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#183247">
<rect x="20" y="142" width="225" height="100" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="132.5" y="173.0" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Субъект</text><text x="132.5" y="204.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">процесс</text><text x="132.5" y="232.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">пользователя</text><rect x="310" y="142" width="250" height="100" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="435.0" y="187.5" text-anchor="middle" font-size="22" font-weight="650" fill="#235eaa">Монитор доступа</text><text x="435.0" y="218.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">проверяет правила</text><rect x="610" y="142" width="150" height="100" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="685.0" y="187.5" text-anchor="middle" font-size="24" font-weight="650" fill="#087e83">Решение</text><text x="685.0" y="218.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">да / нет</text><rect x="825" y="142" width="155" height="100" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="902.5" y="173.0" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">Объект</text><text x="902.5" y="204.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">файл</text><text x="902.5" y="232.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">или запись</text><path d="M257,192 L293.0,192.0" fill="none" stroke="#235eaa" stroke-width="5" stroke-linecap="round"/><polygon points="305,192 293.0,198.0 293.0,186.0" fill="#235eaa"/><path d="M562,192 L585.0,192.0" fill="none" stroke="#235eaa" stroke-width="5" stroke-linecap="round"/><polygon points="597,192 585.0,198.0 585.0,186.0" fill="#235eaa"/><path d="M772,192 L800.0,192.0" fill="none" stroke="#087e83" stroke-width="5" stroke-linecap="round"/><polygon points="812,192 800.0,198.0 800.0,186.0" fill="#087e83"/><text x="790" y="166" text-anchor="middle" font-size="22" font-weight="600" fill="#087e83">да</text><rect x="315" y="16" width="240" height="78" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="435.0" y="50.5" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Политика</text><text x="435.0" y="81.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">правила доступа</text><path d="M435,99 L435.0,116.0" fill="none" stroke="#235eaa" stroke-width="5" stroke-linecap="round"/><polygon points="435,128 429.0,116.0 441.0,116.0" fill="#235eaa"/><path d="M685,254 L685.0,279.0" fill="none" stroke="#a86508" stroke-width="5" stroke-linecap="round"/><polygon points="685,291 679.0,279.0 691.0,279.0" fill="#a86508"/><text x="722" y="280" text-anchor="middle" font-size="22" font-weight="600" fill="#a86508">нет</text><rect x="505" y="302" width="360" height="54" rx="14" fill="#fff5df" stroke="#a86508" stroke-width="2"/><text x="685.0" y="339.0" text-anchor="middle" font-size="23" font-weight="650" fill="#a86508">Отказ: запрос остановлен</text>
</g>
</svg>
