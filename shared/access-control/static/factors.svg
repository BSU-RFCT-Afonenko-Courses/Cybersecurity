<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Знание · владение · характеристика человека">
<desc>Три класса факторов: знание, владение и биометрическая характеристика. Пароль и телефон с приложением TOTP представляют два разных фактора. Пароль и PIN относятся к одному классу знания.</desc>
<rect width="1000" height="350" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#183247">
<rect x="20" y="18" width="290" height="140" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="165.0" y="69.0" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Знание</text><text x="165.0" y="100.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">пароль / PIN</text><text x="165.0" y="128.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">что человек знает</text><rect x="355" y="18" width="290" height="140" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="500.0" y="69.0" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">Владение</text><text x="500.0" y="100.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">телефон / ключ</text><text x="500.0" y="128.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">чем человек владеет</text><rect x="690" y="18" width="290" height="140" rx="14" fill="#fff5df" stroke="#a86508" stroke-width="2"/><text x="835.0" y="69.0" text-anchor="middle" font-size="26" font-weight="650" fill="#a86508">Биометрия</text><text x="835.0" y="100.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">лицо / отпечаток</text><text x="835.0" y="128.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">признак человека</text><rect x="45" y="213" width="225" height="65" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="157.5" y="255.5" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Пароль</text><text x="310" y="255" text-anchor="middle" font-size="32" font-weight="700" fill="#183247">+</text><rect x="350" y="213" width="320" height="65" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="510.0" y="255.5" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">Телефон с TOTP</text><text x="710" y="255" text-anchor="middle" font-size="32" font-weight="700" fill="#183247">=</text><rect x="750" y="213" width="205" height="65" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="852.5" y="255.5" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">2FA</text><text x="500" y="327" text-anchor="middle" font-size="24" font-weight="500" fill="#183247">Пароль + PIN — один фактор: знание</text>
</g>
</svg>
