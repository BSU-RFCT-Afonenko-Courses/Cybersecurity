<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" width="1000" height="355" role="img" aria-label="Пароль → пароль и OTP → passkey">
<desc>Пароль проверяется как секрет. В показанном варианте пароль дополняется TOTP на отдельном телефоне: общий секрет TOTP позволяет вычислять одноразовые коды. Пароль относится к знанию, отдельный телефон — к владению. Passkey подписывает запрос с привязкой к проверяющему сайту. Одноразовый код не устраняет фишинг; для passkey остаются важны защита устройства и восстановление доступа.</desc>
<rect width="1000" height="355" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#183247">
<rect x="20" y="15" width="290" height="135" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="165.0" y="63.5" text-anchor="middle" font-size="26" font-weight="650" fill="#235eaa">Пароль</text><text x="165.0" y="94.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">секрет</text><text x="165.0" y="122.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">проверяется сервером</text><rect x="355" y="15" width="290" height="135" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="500.0" y="63.5" text-anchor="middle" font-size="26" font-weight="650" fill="#087e83">Пароль + TOTP</text><text x="500.0" y="94.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">пароль + код TOTP</text><text x="500.0" y="122.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">с отдельного телефона</text><rect x="690" y="15" width="290" height="135" rx="14" fill="#fff5df" stroke="#a86508" stroke-width="2"/><text x="835.0" y="63.5" text-anchor="middle" font-size="26" font-weight="650" fill="#a86508">Passkey</text><text x="835.0" y="94.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">подпись запроса</text><text x="835.0" y="122.5" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">с привязкой к сайту</text><text x="500" y="196" text-anchor="middle" font-size="26" font-weight="650" fill="#183247">Что защищает и что остаётся</text><rect x="20" y="220" width="290" height="112" rx="14" fill="#eef5ff" stroke="#235eaa" stroke-width="2"/><text x="165.0" y="257.0" text-anchor="middle" font-size="24" font-weight="650" fill="#235eaa">Один фактор</text><text x="165.0" y="288.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">Фишинг может</text><text x="165.0" y="316.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">раскрыть пароль</text><rect x="355" y="220" width="290" height="112" rx="14" fill="#eaf8f6" stroke="#087e83" stroke-width="2"/><text x="500.0" y="257.0" text-anchor="middle" font-size="24" font-weight="650" fill="#087e83">Два фактора</text><text x="500.0" y="288.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">Код тоже можно</text><text x="500.0" y="316.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">перехватить фишингом</text><rect x="690" y="220" width="290" height="112" rx="14" fill="#fff5df" stroke="#a86508" stroke-width="2"/><text x="835.0" y="257.0" text-anchor="middle" font-size="24" font-weight="650" fill="#a86508">Привязка к сайту</text><text x="835.0" y="288.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">Важны устройство</text><text x="835.0" y="316.0" text-anchor="middle" font-size="22" font-weight="400" fill="#183247">и восстановление</text>
</g>
</svg>
