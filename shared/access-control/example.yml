# Авторское описание схем и виджетов доступа.
# Здесь нет SVG, координат, CSS и браузерных обработчиков.
# После правки: node CI/build-access-examples.mjs

# Имена участников. Служебные ключи lena/boris сохраняйте.
subjects:
  lena:
    label: Лена
    processLabel: Редактор Лены
    level: 2
  boris:
    label: Борис
    processLabel: Редактор Бориса
    level: 1

# Названия ресурсов и технические имена файлов.
objects:
  handout:
    label: Памятка
    file: handout.txt
    level: 1
  draft:
    label: Черновик
    file: draft.txt
    level: 2
  answers:
    label: Ответы
    file: answers.txt
    level: 3

# Три уровня учебной MAC; порядок 1, 2, 3 сохраняйте.
levels:
- value: 1
  label: 1 — Открытые
  name: Открытые
- value: 2
  label: 2 — Служебные
  name: Служебные
- value: 3
  label: 3 — Закрытые
  name: Закрытые

# Подписи на самих рисунках. Для ручного переноса можно использовать YAML |.
labels:
  matrixSubject: Кому
  people: Участники
  peopleCompact: Кто
  roles: Роли
  permissions: Разрешения
  permissionsCompact: Права
  levels: Метки данных
  levelsCompact: L
  processes: Процессы
  processesCompact: Процесс
  files: Файлы
  owner: Владелец всех файлов — {subject}
  dacHint: Владелец может менять назначения прав.
  dacGranted: 'Добавлено: {subject} — R на {file}.'
  rbacHint: Разрешения приходят через назначенные роли.
  rbacGranted: '{subject}: дополнительно назначена роль «{role}».'
  processLevel: текущая метка {level}
  processLevelCompact: метка {level}
  fileLevel: уровень {level}
  allowed: Разрешено
  denied: Отказ
  allowedFlow: Допустимый поток данных
  blockedFlow: Отказ на границе
  readFlow: 'Чтение: файл → процесс'
  writeFlow: 'Запись без чтения: процесс → файл'
  editFlow: 'Изменение: чтение и запись'
  copyFlow: 'Копирование: ответы → процесс → памятка'
  dacTitle: 'DAC: права пользователей на файлы'
  rbacTitle: 'RBAC: участники, роли и разрешения'
  macTitle: 'MAC: потоки данных между уровнями'
  dacDescription: Права на три файла задаются для каждого участника. Владелец может менять назначения.
  rbacDescription: Права приходят через роли. Роль рецензента назначается отдельно; наследования ролей в этом примере
    нет.
  macDescription: Три горизонтальные полосы показывают уровни данных. Процессы слева, файлы справа. Стрелки показывают
    направление данных; крест отмечает отказ на границе.
  macOverviewDescription: Процесс Лены имеет текущую метку 2. Он читает памятку уровня 1 и черновик уровня 2. Чтение
    ответов уровня 3 блокируется на границе.

# Переключатели, заголовки и пояснения виджетов.
widget:
  scenarioLabel: Ситуация
  processLabel: Независимый опыт
  objectLabel: Файл
  operationLabel: Операция
  objectOption: '{label} — {file}'
  processes:
    lena2: 'Лена: отдельный процесс L2'
    lena3: 'Лена: отдельный процесс L3'
    boris1: 'Борис: отдельный процесс L1'
  operations:
    read: Чтение
    write: Запись без чтения назначения
    edit: Редактирование
    copy: Копирование ответов в памятку
  modelNames:
    dac: DAC
    rbac: RBAC
    mac: MAC
  structures:
    dac: Назначения прав на объекты
    rbac: Разрешения через роли
    mac: Обязательные метки и границы
  staticCaptions:
    dac: Права на три файла и полномочие владельца
    mac: 'Три уровня: процесс Лены с текущей меткой L2'
    rbac: Участники, роли и разрешения в одном курсе
  pageTitles:
    dac: 'DAC: назначения прав на файлы'
    mac: 'MAC: три уровня и направление данных'
    rbac: 'RBAC: права через роли'
    comparison: Один пример — три модели доступа
  allowed: Допустимо
  denied: Отказ
  independentProcesses: 'Каждый выбор — независимый опыт: состояние процесса не переносится между вариантами.'
  legends:
    dac: R — чтение; W — запись данных. Владелец отдельно управляет назначениями.
    rbac: R — чтение; W — запись данных. Связи показывают назначения, а не перенос данных.
    comparison: R — чтение; W — запись данных. DAC/RBAC показывают связи назначений; MAC — потоки данных. MAC здесь
      — учебная модель Белла — Лападулы.
  fallback: Для изменения примера нужен JavaScript. Статическая схема приведена в разделе.
  intro: Лена — преподаватель, Борис — ассистент. Они работают с памяткой, черновиком заданий и ответами к экзамену.

# Объяснения решений. Значения в {скобках} подставляются автоматически.
messages:
  unknownModel: 'Неизвестная модель: {model}'
  copyReadDenied: 'Процесс {process} не может читать {source} уровня {sourceLevel}: чтение вверх запрещено.'
  copyWriteDenied: 'Процесс {process} может прочитать {source}, но запись в {target} уровня {targetLevel} запрещена:
    данные нельзя переносить вниз.'
  copyAllowed: Чтение {source} и запись в {target} соответствуют текущей метке процесса {process}.
  readAllowed: 'Файл {file} уровня {level} передаёт данные процессу {process}: чтение своего уровня и ниже разрешено.'
  readDenied: 'Процесс {process} не может читать {file} уровня {level}: чтение вверх запрещено. Выдача обычного
    права не меняет метку.'
  writeAllowed: 'Процесс {process} записывает данные в {file} уровня {level} без чтения назначения: запись своего
    уровня и выше разрешена.'
  writeDenied: 'Запись из процесса {process} в {file} уровня {level} запрещена: данные нельзя передавать вниз.'
  editAllowed: Изменение {file} включает чтение и запись; обе операции разрешены при совпадении меток {process}.
  editDenied: Изменение включает чтение и запись, поэтому метка файла {level} должна совпадать с текущей меткой
    процесса {process}.
  permissionAllowed: '{subject}: есть {requested} {basis}.'
  permissionDenied: '{subject}: не хватает {requested} {basis}.'
  permissionRequest: '{right} на {file}'
  permissionJoin: ' и '
  dacBasis: в назначениях прав на файлы
  rbacBasis: через назначенные роли
  copyPermissionSuffix: ' Отдельного запрета переноса данных в этой модели примера нет.'

# Назначения RBAC. Для обычной правки текста достаточно label.
roles:
  author:
    label: Автор
    subjects: [lena]
    permissions:
    - object: handout
      rights: [R, W]
    - object: draft
      rights: [R, W]
    - object: answers
      rights: [R, W]
  assistant:
    label: Ассистент
    subjects: [boris]
    permissions:
    - object: handout
      rights: [R]
  reviewer:
    label: Рецензент
    subjects: []
    permissions:
    - object: answers
      rights: [R]

# Права DAC. Идентификаторы и R/W связывают данные с правилами.
dac:
  owner: lena
  rights:
    lena:
      handout: [R, W]
      draft: [R, W]
      answers: [R, W]
    boris:
      handout: [R]
      draft: []
      answers: []

# Что меняется в опыте выдачи доступа.
grant:
  subject: boris
  object: answers
  rights: [R]
  role: reviewer

# Источник и назначение в опыте копирования.
copy:
  source: answers
  target: handout

# Четыре независимых опыта; label — текст в переключателе.
scenarios:
- id: handout
  label: Борис читает памятку
  state:
    subject: boris
    object: handout
    operation: read
    processLevel: 1
    granted: false
- id: answers
  label: 'Борис читает ответы: исходные назначения'
  state:
    subject: boris
    object: answers
    operation: read
    processLevel: 1
    granted: false
- id: grant
  label: 'Борис читает ответы: после выдачи доступа'
  state:
    subject: boris
    object: answers
    operation: read
    processLevel: 1
    granted: true
- id: copy
  label: Лена копирует ответы в памятку
  state:
    subject: lena
    object: handout
    operation: copy
    processLevel: 3
    granted: false
